name: Deploy digest preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: Lane marker to render in the public preview
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: corepack pnpm@10.18.3 install --frozen-lockfile
      - name: Render digest page
        env:
          LANE_MARKER: ${{ inputs.marker }}
        run: |
          corepack pnpm@10.18.3 start > /tmp/rig.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          mkdir -p site
          curl --fail --silent --show-error \
            http://localhost:8787/digest/2026-10-28 \
            --output site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
